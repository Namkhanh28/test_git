<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Form Đăng Ký</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .register-form {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 300px;
    }
    .register-form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    .register-form label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    .register-form input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .register-form button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .register-form button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <form class="register-form">
    <h2>Đăng Ký</h2>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Mật khẩu</label>
    <input type="password" id="password" name="password" required>

    <label for="confirm-password">Nhập lại mật khẩu</label>
    <input type="password" id="confirm-password" name="confirm-password" required>

    <button type="submit">Đăng Ký</button>
  </form>
</body>
</html>
